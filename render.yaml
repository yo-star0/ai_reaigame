services:
  - type: web
    name: ai-reaigame-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false              # set to a Neon/Supabase connection string
      - key: API_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        sync: false              # set to the deployed Vercel URL
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
