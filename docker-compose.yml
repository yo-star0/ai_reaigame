services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_reaigame_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reaigame
      POSTGRES_PASSWORD: reaigame
      POSTGRES_DB: reaigame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reaigame -d reaigame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
